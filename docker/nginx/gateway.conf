# Gateway Nginx Configuration
# This handles subdomain routing to different apps

server {
    listen 80;
    server_name api.lvh.me;

    location / {
        proxy_pass http://be:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name admin.lvh.me;

    location / {
        proxy_pass http://fe-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name shop.lvh.me;

    location / {
        proxy_pass http://fe-store:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Main Landing Page
server {
    listen 80;
    server_name lvh.me;

    location / {
        proxy_pass http://fe-landing:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Wildcard for Tenants
server {
    listen 80;
    server_name *.lvh.me;

    location / {
        proxy_pass http://fe-customer:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
