services:
  db:
    image: mysql:8.0
    container_name: saas_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: db_platform
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: saas_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: saas_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-changeme}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  be:
    build: ./apps/be
    container_name: saas_be
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DB_PLATFORM_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-changeme}@db:3306/db_platform
      - RETAIL_DB_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-changeme}@db:3306/db_retail_template
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD:-changeme}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PREFIX=saas
      - MONGO_URI=mongodb://${MONGO_USER:-root}:${MONGO_PASS:-changeme}@mongodb:27017/saas_logs?authSource=admin
      - PORT=8080
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-your_access_secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your_refresh_secret}
      - JWT_ACCESS_EXPIRES=1h
      - JWT_REFRESH_EXPIRES=7d
      - BCRYPT_ROUNDS=10
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      - CLOUDINARY_NAME=${CLOUDINARY_NAME:-your_name}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-your_key}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-your_secret}
      - VNP_TMN_CODE=${VNP_TMN_CODE:-}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET:-}
      - VNP_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - VNP_RETURN_URL=${VNP_RETURN_URL:-http://localhost:8080/api/payment/vnpay_return}
      - STORE_FRONTEND_URL=${STORE_FRONTEND_URL:-http://localhost:3004}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started

  fe-landing:
    build: ./apps/fe-landing
    container_name: saas_fe_landing
    restart: always

  fe-admin:
    build: ./apps/fe-admin
    container_name: saas_fe_admin
    restart: always

  fe-store:
    build: ./apps/fe-store
    container_name: saas_fe_store
    restart: always

  fe-customer:
    build: ./apps/fe-customer
    container_name: saas_fe_customer
    restart: always

  proxy:
    image: nginx:alpine
    container_name: saas_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - be
      - fe-landing
      - fe-admin
      - fe-store
      - fe-customer

volumes:
  mysql_data:
  mongo_data:
